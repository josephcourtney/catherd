name: Temporary ui-makeover validation

on:
  push:
    branches:
      - ui-makeover

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Format changed files
        run: uv run ruff format --check src/catherd/tui.py tests/test_tui.py
      - name: Lint changed files
        run: uv run ruff check --no-fix src/catherd/tui.py tests/test_tui.py
      - name: Typecheck source and tests
        run: uv run ty check src tests
      - name: Import architecture
        run: uv run lint-imports --cache-dir .cache/import-linter --verbose --config import-linter.toml
      - name: Full test suite
        run: uv run pytest --no-cov tests
