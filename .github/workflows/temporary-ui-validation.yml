name: Temporary ui-makeover validation

on:
  push:
    branches:
      - ui-makeover

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Show formatter changes
        run: |
          uv run ruff format src/catherd/tui.py tests/test_tui.py
          git diff -- src/catherd/tui.py tests/test_tui.py
      - name: Lint changed files
        run: uv run ruff check --no-fix src/catherd/tui.py tests/test_tui.py
      - name: Typecheck repository
        run: uv run ty check src tests
      - name: TUI tests
        run: uv run pytest --no-cov tests/test_tui.py
